# EchoZero API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echozero-api
  namespace: echozero
  labels:
    app: echozero
    component: api
    version: v4.2.1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: echozero
      component: api
  template:
    metadata:
      labels:
        app: echozero
        component: api
        version: v4.2.1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: echozero-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Node selector for GPU nodes
      nodeSelector:
        accelerator: nvidia-gpu

      # Tolerations for GPU taints
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: echozero-api
          image: echozero:v4.2.1
          imagePullPolicy: Always

          command: ["python", "-m", "uvicorn", "src.api.server:app"]
          args:
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--workers"
            - "4"

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP

          envFrom:
            - configMapRef:
                name: echozero-config

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              cpu: "4000m"
              nvidia.com/gpu: 1

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: checkpoints
              mountPath: /app/checkpoints
            - name: logs
              mountPath: /app/logs

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30

      volumes:
        - name: config
          configMap:
            name: echozero-dimensions
        - name: checkpoints
          persistentVolumeClaim:
            claimName: echozero-checkpoints
        - name: logs
          persistentVolumeClaim:
            claimName: echozero-logs

---
# Autonomy Loop Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echozero-autonomy
  namespace: echozero
  labels:
    app: echozero
    component: autonomy
    version: v4.2.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echozero
      component: autonomy
  template:
    metadata:
      labels:
        app: echozero
        component: autonomy
        version: v4.2.1
    spec:
      serviceAccountName: echozero-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      nodeSelector:
        accelerator: nvidia-gpu

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      containers:
        - name: echozero-autonomy
          image: echozero:v4.2.1
          imagePullPolicy: Always

          command: ["python", "-m", "src.autonomy.loop"]

          envFrom:
            - configMapRef:
                name: echozero-config

          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              cpu: "4000m"
              nvidia.com/gpu: 1

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: checkpoints
              mountPath: /app/checkpoints
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: config
          configMap:
            name: echozero-dimensions
        - name: checkpoints
          persistentVolumeClaim:
            claimName: echozero-checkpoints
        - name: logs
          persistentVolumeClaim:
            claimName: echozero-logs
