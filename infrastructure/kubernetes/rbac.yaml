# ServiceAccount for EchoZero
apiVersion: v1
kind: ServiceAccount
metadata:
  name: echozero-sa
  namespace: echozero
  labels:
    app: echozero

---
# Role for EchoZero pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: echozero-role
  namespace: echozero
rules:
  # Allow reading ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Allow reading Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # Allow pod discovery for distributed coordination
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Allow checkpoint persistence
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: echozero-rolebinding
  namespace: echozero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: echozero-role
subjects:
  - kind: ServiceAccount
    name: echozero-sa
    namespace: echozero
