{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "echozero.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echozero.labels" . | nindent 4 }}
    component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "echozero.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "echozero.selectorLabels" . | nindent 8 }}
        component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.monitoring.prometheus.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.monitoring.prometheus.port | quote }}
        prometheus.io/path: {{ .Values.monitoring.prometheus.path }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "echozero.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: echozero-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn", "src.api.server:app"]
          args:
            - "--host"
            - {{ .Values.config.apiHost | quote }}
            - "--port"
            - {{ .Values.config.apiPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.config.apiPort }}
              protocol: TCP
            {{- if .Values.monitoring.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.monitoring.prometheus.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: ECHOZERO_ENV
              value: {{ .Values.config.environment | quote }}
            - name: ECHOZERO_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ECHOZERO_N
              value: {{ .Values.config.N | quote }}
            - name: ECHOZERO_DEVICE
              value: {{ .Values.config.device | quote }}
            - name: ECHOZERO_RATE_LIMIT
              value: {{ .Values.config.rateLimit | quote }}
            - name: ECHOZERO_RATE_WINDOW
              value: {{ .Values.config.rateWindow | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if .Values.persistence.checkpoints.enabled }}
            - name: checkpoints
              mountPath: /app/checkpoints
            {{- end }}
            {{- if .Values.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/logs
            {{- end }}
          {{- if .Values.healthCheck.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.healthCheck.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.healthCheck.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.startup.periodSeconds }}
            failureThreshold: {{ .Values.healthCheck.startup.failureThreshold }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "echozero.fullname" . }}-dimensions
        {{- if .Values.persistence.checkpoints.enabled }}
        - name: checkpoints
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.checkpoints.existingClaim | default (printf "%s-checkpoints" (include "echozero.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.logs.enabled }}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.logs.existingClaim | default (printf "%s-logs" (include "echozero.fullname" .)) }}
        {{- end }}
{{- end }}

---
{{- if .Values.autonomy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "echozero.fullname" . }}-autonomy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "echozero.labels" . | nindent 4 }}
    component: autonomy
spec:
  replicas: {{ .Values.autonomy.replicaCount }}
  selector:
    matchLabels:
      {{- include "echozero.selectorLabels" . | nindent 6 }}
      component: autonomy
  template:
    metadata:
      labels:
        {{- include "echozero.selectorLabels" . | nindent 8 }}
        component: autonomy
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "echozero.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: echozero-autonomy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "src.autonomy.loop"]
          env:
            - name: ECHOZERO_ENV
              value: {{ .Values.config.environment | quote }}
            - name: ECHOZERO_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ECHOZERO_N
              value: {{ .Values.config.N | quote }}
            - name: ECHOZERO_DEVICE
              value: {{ .Values.config.device | quote }}
            - name: ECHOZERO_AUTONOMY_DT
              value: {{ .Values.config.autonomyDt | quote }}
            - name: ECHOZERO_DRIFT_THRESHOLD
              value: {{ .Values.config.driftThreshold | quote }}
          resources:
            {{- toYaml .Values.autonomy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            {{- if .Values.persistence.checkpoints.enabled }}
            - name: checkpoints
              mountPath: /app/checkpoints
            {{- end }}
            {{- if .Values.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/logs
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "echozero.fullname" . }}-dimensions
        {{- if .Values.persistence.checkpoints.enabled }}
        - name: checkpoints
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.checkpoints.existingClaim | default (printf "%s-checkpoints" (include "echozero.fullname" .)) }}
        {{- end }}
        {{- if .Values.persistence.logs.enabled }}
        - name: logs
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.logs.existingClaim | default (printf "%s-logs" (include "echozero.fullname" .)) }}
        {{- end }}
{{- end }}
